<div class="contact-bento">
  <button class="dossier-close-btn" (click)="dialogRef.close()">✕</button>

    <div class="title-container">
      <img
        src="assets/images/lets connect 3.png"

        class="connect-title-img"
      />
    </div>

    <div class="headline">
      Looking for <br />
      <span class="blue">Yardi Portfolio Optimizer</span> <br />
      or a <span class="green">teammate?</span>

    <p class="description">I'm available for a Full-time or Freelance.</p>
    <!-- I'm available for a Full-time or Freelance. -->
    <div class="action-grid">
      <a
        class="action-item"
        href="mailto:shrikantrs178@gmail.com?subject=Yardi%20Consulting%20Engagement%20-%20Inquiry"

        <i class="fas fa-envelope"></i>
        <span>Email</span>
      </a>

      <a
        class="action-item"
        href="https://linkedin.com"
        target="_blank"
        rel="noopener"
      >
        <i class="fab fa-linkedin-in"></i>
        <span>LinkedIn</span>
      </a>

      <a class="action-item">
        <i class="fas fa-comments"></i>

      </a>

      <a
        href="https://calendly.com/shrikantshinde"
        target="_blank"
        rel="noopener noreferrer"
        class="action-item"

        <i class="far fa-calendar-alt"></i>

      </a>
    </div>

    <div class="bottom-banner">
      Let's build <span class="highlight-green">smarter portfolios</span> and
      <span class="highlight-green">stronger teams.</span>
    </div>
  </div>

  <div class="right-panel">
    <img
      src="assets/images/City.png"

    />
