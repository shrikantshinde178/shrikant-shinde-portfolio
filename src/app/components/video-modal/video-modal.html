<div class="video-overlay">
  <button class="close-btn" (click)="closeVideo()">
    <span class="icon">&times;</span>
    <span class="text">Back to Portfolio</span>
  </button>

  <div class="video-container">
    <!-- Loader -->
    <div class="loader" *ngIf="!videoLoaded"></div>

    <!-- Video -->
    <video
      controls
      autoplay
      muted
      playsinline
      class="main-video"
      [class.loaded]="videoLoaded"
      (loadeddata)="onVideoLoad()"
    >
      <source
        src="assets/video/based_on_this_image_can_you_cr.mp4"
        type="video/mp4"
      />
    </video>
  </div>
</div>
