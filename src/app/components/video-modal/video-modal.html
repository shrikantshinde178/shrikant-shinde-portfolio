<div class="video-overlay">
  <div class="video-modal">
    <button
      class="close-btn"
      type="button"
      aria-label="Close introduction video"
      (click)="closeVideo()"
    >
      <span class="icon">&times;</span>
      <span class="text">Back to Portfolio</span>
    </button>

    <div class="video-container">
      <!-- Loader -->
      <div class="loader" *ngIf="!videoLoaded" aria-label="Loading video"></div>

      <!-- Video -->
      <video
        controls
        autoplay
        muted
        playsinline
        preload="metadata"
        class="main-video"
        [class.loaded]="videoLoaded"
        (loadeddata)="onVideoLoad()"
      >
        <source
          src="assets/video/based_on_this_image_can_you_cr.mp4"
          type="video/mp4"
        />
        Your browser does not support HTML5 video.
      </video>
    </div>
  </div>
</div>
